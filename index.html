<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Reset removes default browser styling -->
  <link href="reset.css" rel="stylesheet">
  <!-- Main stylesheet -->
  <link href="style.css" rel="stylesheet">

  <title>Odd Duck Product Voting</title>
</head>

<body>

  <header class="container1">
    <strong><h1 style="font-size: 48px;">Odd Duck Product Voting</h1></strong>
    <p>Click the product you would like to see created!</p>
  </header>

  <main>

    <!-- 
      Section that holds the three product images.
      We attach ONE event listener to this section (event delegation).
    -->
    <section id="productImages">
      <img src="" alt="" id="img1" class="product-img">
      <img src="" alt="" id="img2" class="product-img">
      <img src="" alt="" id="img3" class="product-img">
    </section>

    <!-- Buttons Section -->
    <section id="buttonSection">
      <!-- Hidden until 25 rounds complete -->
      <button id="showResults" hidden>View Results</button>
      <button id="reset" hidden>Reset Voting</button>
    </section>

    <!-- Results Display Section -->
    <section id="resultsSection">
      <h2>Results</h2>
      <div id="results"></div>
    </section>

  </main>


  <script src="app.js"></script>
</body>
</html>
